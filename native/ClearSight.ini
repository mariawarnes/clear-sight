; Clear Sight - High Contrast Accessibility
[General]
; Starts enabled. Press Ctrl+Shift+H in game to toggle.
Enabled=1
ToggleKey=72
RequireCtrl=1
RequireShift=1
; Retain reduced grayscale albedo detail; original normals/light/shadows stay intact.
WorldDetail=0.12
; Lift only dark scenery after shading. Set lift to 0 to disable.
SceneryShadowLift=0.035
SceneryShadowRange=0.06
ActorDetail=0.20
FaceDetail=0.35
; Blue includes non-hostile NPCs. Set 0 for grey neutrals and blue teammates only.
NonHostileActorsBlue=1
; Reduce specular highlights and environment reflections during treatment.
HighlightScale=0.15
; Smaller derived textures keep a whole scene resident and reduce first-use cost.
MaxTextureDimension=256
CacheMegabytes=256

[Palette]
; Change the three highlight colours below independently, then restart Skyrim.
; Names: Blue, Red, Yellow, Green, Cyan, Purple, Magenta, Orange, White, Grey, Black.
; Custom colours: #RRGGBB (for example #A600A6), or RGB decimals from 0 to 1.
; Ally = living non-hostile characters (including follow targets).
; Enemy = living hostile characters. Important = quest objects and route doors, not people.
Ally=Blue
Enemy=Red
Important=Yellow
; Scenery and dead bodies have separate settings:
; Ordinary scenery is desaturated after shading; World affects its brightness.
; Default highlight presets are contrast-tested against this dark neutral grey.
; Lighting/exposure can still change the final on-screen contrast.
World=0.06,0.06,0.06
Neutral=0.40,0.43,0.45
